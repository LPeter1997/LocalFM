# The Android NDK FFmpeg and localfm_native are built with (docs/android.md), from the runner's Android SDK.
# One place for the version: the FFmpeg cache key hashes this file.
name: ndk
description: Pinned Android NDK; sets ANDROID_NDK_HOME
runs:
  using: composite
  steps:
    - name: Android NDK
      shell: bash
      env:
        NDK_VERSION: 28.2.13676358
      run: |
        sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
        # sdkmanager needs Java 17+, newer than some runners' default JDK.
        export JAVA_HOME=${JAVA_HOME_21_X64:-${JAVA_HOME_17_X64:-$JAVA_HOME}}
        sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
        # `yes` dies of SIGPIPE once sdkmanager stops reading, which pipefail would count as a failure.
        (yes || true) | "$sdkmanager" --licenses > /dev/null
        "$sdkmanager" --install "ndk;$NDK_VERSION" > ndk.log 2>&1 || { tail -50 ndk.log; exit 1; }
        echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
