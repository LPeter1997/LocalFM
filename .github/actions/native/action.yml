# Unpacks the cached FFmpeg (the ffmpeg workflow's artifact) to $FFMPEG_PREFIX and builds localfm_native against
# it into native/out/<rid>/, where LocalFM.Native picks it up for tests and publishes.
name: native
description: Bundled FFmpeg and localfm_native for one RID
inputs:
  rid:
    required: true
runs:
  using: composite
  steps:
    - if: startsWith(inputs.rid, 'android-')
      uses: ./.github/actions/ndk
    - uses: actions/download-artifact@v8
      with:
        name: ffmpeg-${{ inputs.rid }}
        path: ${{ runner.temp }}
    - name: Unpack FFmpeg, build localfm_native
      shell: bash
      env:
        RID: ${{ inputs.rid }}
      run: |
        # Per RID: the Android job builds two RIDs in one runner.
        prefix="$RUNNER_TEMP/ffmpeg-$RID"
        local=""
        # GNU tar reads "D:/…" as a remote host; --force-local keeps it a file.
        if [ "$RUNNER_OS" = Windows ]; then prefix=$(cygpath -m "$prefix"); local=--force-local; fi
        mkdir -p "$prefix"
        tar $local -C "$prefix" -xzf "$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/ffmpeg-$RID.tar.gz"
        echo "FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
        case "$RUNNER_OS" in
          Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
        esac
        native/build.sh "$RID" "$prefix"
        ls -la "native/out/$RID"
