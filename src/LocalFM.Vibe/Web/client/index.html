<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LocalFM</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand"><img src="icon.svg" alt=""><span>LocalFM</span></div>
    <button class="f navitem" data-view="albums"><i data-icon="album"></i><span>Albums</span></button>
    <button class="f navitem" data-view="artists"><i data-icon="artist"></i><span>Artists</span></button>
    <button class="f navitem" data-view="songs"><i data-icon="tracks"></i><span>Songs</span></button>
    <button class="f navitem" data-view="playlists"><i data-icon="playlist"></i><span>Playlists</span></button>
    <button class="f navitem" data-view="search"><i data-icon="search"></i><span>Search</span></button>
    <button class="f navitem" data-view="nowplaying"><i data-icon="wave"></i><span>Now playing</span></button>
    <div class="navfoot" id="hostname"></div>
  </nav>
  <main id="main"></main>
  <footer id="bar" class="hidden">
    <button class="f barnow" id="barnow">
      <div class="cover small" id="barcover"></div>
      <div class="bartext"><div class="title" id="bartitle"></div><div class="muted" id="barartist"></div></div>
    </button>
    <div class="barcontrols">
      <button class="f round side" id="barshuffle" title="Shuffle"><i data-icon="shuffle"></i></button>
      <button class="f round" id="barprev" title="Previous"><i data-icon="prev"></i></button>
      <button class="f round big" id="barplay" title="Play/pause"><i data-icon="play" id="barplayicon"></i></button>
      <button class="f round" id="barnext" title="Next"><i data-icon="next"></i></button>
      <button class="f round side" id="barrepeat" title="Repeat"><i data-icon="repeat"></i></button>
    </div>
    <div class="barprogress">
      <span class="muted time" id="barpos">0:00</span>
      <div class="track"><div class="fill" id="barfill"></div></div>
      <span class="muted time" id="bardur">0:00</span>
    </div>
  </footer>
</div>
<div id="overlay" class="hidden"></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
